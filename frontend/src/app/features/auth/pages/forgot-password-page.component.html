<main class="auth-page auth-page--compact">
  <section class="auth-panel">
    <mat-card class="auth-card">
      <div class="auth-card__header">
        <div class="brand-mark">ST</div>
        <div>
          <h2>Reset access</h2>
          <p>We will send reset instructions if the account exists.</p>
        </div>
      </div>
      @if (sent()) {
        <p class="success-state">Password reset instructions have been requested.</p>
        <a mat-flat-button color="primary" routerLink="/auth/login">Back to login</a>
      } @else {
        <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
          <mat-form-field appearance="fill">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email">
          </mat-form-field>
          <button mat-flat-button color="primary" type="submit">Send instructions</button>
          <a routerLink="/auth/login">Back to login</a>
        </form>
      }
    </mat-card>
  </section>
</main>
