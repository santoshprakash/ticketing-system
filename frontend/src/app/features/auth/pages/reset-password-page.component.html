<main class="auth-page auth-page--compact">
  <section class="auth-panel">
    <mat-card class="auth-card">
      <div class="auth-card__header">
        <div class="brand-mark">ST</div>
        <div>
          <h2>Set new password</h2>
          <p>Use the secure token from your reset instructions.</p>
        </div>
      </div>
      @if (completed()) {
        <p class="success-state">Password reset complete.</p>
        <a mat-flat-button color="primary" routerLink="/auth/login">Sign in</a>
      } @else {
        <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
          <mat-form-field appearance="fill">
            <mat-label>Reset token</mat-label>
            <input matInput formControlName="token">
          </mat-form-field>
          <mat-form-field appearance="fill">
            <mat-label>New password</mat-label>
            <input matInput type="password" formControlName="newPassword">
          </mat-form-field>
          <button mat-flat-button color="primary" type="submit">Reset password</button>
          <a routerLink="/auth/login">Back to login</a>
        </form>
      }
    </mat-card>
  </section>
</main>
