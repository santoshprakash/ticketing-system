services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketing-postgres
    environment:
      POSTGRES_DB: ticketing_system
      POSTGRES_USER: ticketing_user
      POSTGRES_PASSWORD: ticketing_password
    ports:
      - "5432:5432"
    volumes:
      - ticketing_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing_user -d ticketing_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: ticketing-backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ticketing_system
      DB_USERNAME: ticketing_user
      DB_PASSWORD: ticketing_password
      JWT_SECRET: change-me-in-secure-environments-change-me-now-64-bytes-minimum
      CORS_ALLOWED_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ticketing_postgres_data:
